[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alde"
version = "0.0.0"
description = "ALDE packaged for local imports"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
mongodb = ["pymongo>=4.6"]
webplayer = ["cryptography>=41.0", "websockets>=12.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ALDE*"]

[tool.pytest.ini_options]
testpaths = ["ALDE/alde"]
addopts = "--ignore=ALDE/alde/Tests"
